---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops
  labels:
    app: swiggy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: swiggy
  template:
    metadata:
      labels:
        app: swiggy

    spec:
      containers:
        - name: cont1
          image: ysv26/sports-ticket-app:latest
          ports:
            - containerPort: 80
